services:

  web:
    build: .
    container_name: day30-web
    ports:
      - "8083:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: day30-mysql

    environment:
      MYSQL_ROOT_PASSWORD: devopsroot
      MYSQL_DATABASE: devopsdb
      MYSQL_USER: devopsuser
      MYSQL_PASSWORD: devopspass

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
